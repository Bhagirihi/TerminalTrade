<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Muhurat2 Live</title>
<style>
  :root {
    --bg:#0b0e14; --card:#141926; --line:#232a3d; --txt:#e6e9f0; --dim:#8b93a7;
    --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --blue:#60a5fa;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header {
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    padding:14px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
    border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(11,14,20,.92); backdrop-filter:blur(8px); z-index:5;
  }
  h1 { margin:0; font-size:18px; font-weight:700; letter-spacing:-.02em; }
  .badges { display:flex; flex-wrap:wrap; gap:8px; }
  .badge { font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--dim); }
  .badge.live { color:var(--green); border-color:rgba(34,197,94,.45); }
  .badge.warn { color:var(--amber); border-color:rgba(245,158,11,.45); }
  .badge.err { color:var(--red); border-color:rgba(239,68,68,.45); }
  main { padding:14px max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display:grid; gap:14px; max-width:1200px; margin:0 auto; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .panel h2 { margin:0 0 10px; font-size:14px; font-weight:650; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .phase { font-size:15px; font-weight:600; margin:0 0 8px; }
  .phase.ok { color:var(--green); } .phase.wait { color:var(--amber); }
  .meta { color:var(--dim); font-size:13px; display:flex; flex-wrap:wrap; gap:6px 14px; }
  .signals { display:grid; gap:8px; }
  .sig {
    font-size:22px; font-weight:800; letter-spacing:.01em; padding:12px 14px; border-radius:12px;
    border:1px solid var(--line); font-variant-numeric:tabular-nums;
  }
  .sig.buy { color:#052e16; background:linear-gradient(90deg,#22c55e,#4ade80); border-color:#16a34a; }
  .sig.sell { color:#450a0a; background:linear-gradient(90deg,#ef4444,#f87171); border-color:#dc2626; }
  .empty { color:var(--dim); font-size:13.5px; margin:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:10px; }
  .card {
    border:1px solid var(--line); border-radius:12px; padding:12px; background:#10182a; min-width:0;
  }
  .card.buy { border-color:rgba(34,197,94,.55); }
  .card.watch { border-color:rgba(245,158,11,.45); }
  .card-top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:6px; }
  .ticker { font-weight:750; font-size:15px; }
  .p { color:var(--dim); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .tag { font-size:11px; font-weight:800; letter-spacing:.04em; }
  .tag.buy { color:var(--green); } .tag.watch { color:var(--amber); }
  .rows { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12.5px; }
  .rows span { color:var(--dim); } .rows b { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  .up { color:var(--green); } .down { color:var(--red); }
  .pos { margin-top:8px; padding:8px 10px; border-radius:8px; border:1px solid rgba(34,197,94,.35); background:#0f1f17; font-size:13px; }
  .err { color:var(--red); font-size:13px; margin:8px 0 0; word-break:break-word; }
  .split { display:grid; gap:14px; }
  @media (min-width:900px) { .split.both { grid-template-columns:1fr 1fr; } }
  footer { color:var(--dim); font-size:12px; text-align:center; padding-bottom:8px; }
  a { color:var(--blue); text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>Muhurat2</h1>
  <div class="badges">
    <span class="badge" id="modeBadge">—</span>
    <span class="badge" id="feedBadge">connecting…</span>
    <span class="badge" id="clockBadge">—</span>
  </div>
</header>
<main>
  <section class="panel" id="signalsPanel">
    <h2>User signals</h2>
    <div class="signals" id="signals"><p class="empty">Waiting for live picks…</p></div>
  </section>
  <section class="panel" id="statusPanel">
    <h2>Session</h2>
    <p class="phase wait" id="phaseLine">Connecting…</p>
    <div class="meta" id="metaLine"></div>
    <p class="err" id="errorLine" hidden></p>
  </section>
  <div class="split" id="books"></div>
</main>
<footer>
  Same rules as terminal · BUY after 9:25 · confirm ~3 min · hard exit 3:15 ·
  <a href="/">Supertrend dashboard</a>
</footer>
<script>
const fmt = (x, d=2) => x == null || Number.isNaN(Number(x)) ? '—' : Number(x).toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
const money = (x) => x == null || Number.isNaN(Number(x)) ? '—' : '₹' + fmt(x);

function renderSignals(sig) {
  const el = document.getElementById('signals');
  const buys = (sig && sig.buys) || [];
  const sells = (sig && sig.sells) || [];
  if (!buys.length && !sells.length) {
    el.innerHTML = '<p class="empty">No BUY(USER) / SELL(USER) yet — watchlist only or still confirming.</p>';
    return;
  }
  el.innerHTML = [
    ...buys.map((t) => `<div class="sig buy">BUY(USER) ==> ${t}</div>`),
    ...sells.map((t) => `<div class="sig sell">SELL(USER) ==> ${t}</div>`),
  ].join('');
}

function cardHtml(r) {
  if (!r) return '';
  const v = r.verdict === 'BUY' ? 'buy' : 'watch';
  const tag = r.verdict === 'BUY' ? 'BUY' : (r.action || r.verdict || 'WATCH');
  const lv = r.levels || {};
  return `<article class="card ${v}">
    <div class="card-top">
      <div><span class="ticker">${r.ticker || '—'}</span> <span class="tag ${v}">${tag}</span></div>
      <div class="p">P${fmt(r.profitScore)}</div>
    </div>
    <div class="rows">
      <span>LTP</span><b>${fmt(r.ltp)}</b>
      <span>SL</span><b class="down">${fmt(r.sellStop || lv.stopLoss)}</b>
      <span>T1</span><b class="up">${fmt(r.sellT1 || lv.target1)}</b>
      <span>T2</span><b class="up">${fmt(r.sellT2 || lv.target2)}</b>
      ${r.qty > 0 ? `<span>Qty</span><b>${r.qty}${r.spend ? ' · ' + money(r.spend) : ''}</b>` : ''}
      ${r.confirmLeftSec != null ? `<span>Confirm</span><b>${r.confirmLeftSec}s</b>` : ''}
    </div>
  </article>`;
}

function sectionCards(title, rows) {
  const list = (rows || []).filter(Boolean);
  if (!list.length) return '';
  return `<section class="panel"><h2>${title}</h2><div class="grid">${list.map(cardHtml).join('')}</div></section>`;
}

function botHtml(bot, label) {
  if (!bot) return '';
  const bits = [];
  if (bot.live) bits.push(`<div class="meta">FULL AUTO · product ${bot.product || 'I'} · spend ${money(bot.spend)} · open ${bot.openCount || 0}${bot.tradesToday != null ? ' · trades ' + bot.tradesToday + '/' + (bot.maxTrades || '∞') : ''}</div>`);
  for (const p of bot.positions || []) {
    bits.push(`<div class="pos"><b>${p.ticker}</b> qty ${p.qty} · entry ${fmt(p.entry)} · SL ${fmt(p.stop)} · last ${fmt(p.last)} · ${p.stage || ''}</div>`);
  }
  if (bot.lastError) bits.push(`<p class="err">${bot.lastError}</p>`);
  if (!bits.length) return '';
  return `<section class="panel"><h2>${label || 'Bot'}</h2>${bits.join('')}</section>`;
}

function bookBlock(book, bot, title) {
  if (!book) return '';
  const phase = book.phase || {};
  const live = phase.canDecideBuy
    ? (book.liveBuys || []).filter((r) => r && r.verdict === 'BUY' && Number(r.profitScore) > 12)
    : [];
  const watch = phase.canDecideBuy
    ? (book.extrasWatch || []).filter((r) => r && Number(r.profitScore) > 12)
    : (book.core && book.core.length ? book.core : book.prep || []).filter((r) => r && Number(r.profitScore) > 12);
  const confirming = (book.budget && book.budget.confirming) || [];
  const bud = book.budget;
  const meta = [
    book.mode === 'options' ? 'Options' : 'Stocks',
    phase.clock ? 'now ' + phase.clock : '',
    bud ? 'budget ' + money(bud.budget) : '',
    book.availableMargin != null ? 'margin ' + money(book.availableMargin) : '',
  ].filter(Boolean).join(' · ');
  return `
    <div>
      <section class="panel">
        <h2>${title}</h2>
        <p class="phase ${phase.canDecideBuy ? 'ok' : 'wait'}">${phase.message || '—'}</p>
        <div class="meta">${meta}</div>
        ${book.lossGate && book.lossGate.blocked ? `<p class="err">DO NOT TRADE · book loss ${book.lossGate.pnlPct}%</p>` : ''}
      </section>
      ${botHtml(bot, title + ' bot')}
      ${sectionCards(phase.canDecideBuy ? 'Live BUY — P > 12' : 'Watchlist — P > 12 (no BUY call yet)', phase.canDecideBuy ? live : watch)}
      ${phase.canDecideBuy ? sectionCards('Watchlist — P > 12', watch) : ''}
      ${sectionCards('Confirming', confirming)}
      ${sectionCards('Top Gainers — P > 12', book.topGainers)}
    </div>`;
}

function render(state) {
  if (!state) return;
  const mode = state.mode || 'equity';
  document.getElementById('modeBadge').textContent = mode === 'both' ? 'stocks + options' : mode;
  const feed = state.feed === 'live' ? 'FEED LIVE' : state.feed === 'poll' ? 'FEED POLL' : 'FEED —';
  const fb = document.getElementById('feedBadge');
  fb.textContent = feed;
  fb.className = 'badge' + (state.feed === 'live' ? ' live' : state.feed === 'poll' ? ' warn' : '');
  document.getElementById('clockBadge').textContent = state.updatedAt || '—';

  const phase = (state.book && state.book.phase) || {};
  const pl = document.getElementById('phaseLine');
  pl.textContent = phase.message || 'Waiting…';
  pl.className = 'phase ' + (phase.canDecideBuy ? 'ok' : 'wait');
  document.getElementById('metaLine').textContent = [
    phase.clock ? 'now ' + phase.clock : '',
    state.feed ? feed : '',
  ].filter(Boolean).join(' · ');

  const err = document.getElementById('errorLine');
  if (state.error) { err.hidden = false; err.textContent = state.error; }
  else { err.hidden = true; err.textContent = ''; }

  renderSignals(state.userSignals);
  const books = document.getElementById('books');
  books.className = 'split' + (mode === 'both' ? ' both' : '');
  if (mode === 'both') {
    books.innerHTML = bookBlock(state.book, state.bot, 'Stocks') + bookBlock(state.optionsBook, state.optionsBot, 'Options');
  } else if (mode === 'options') {
    books.innerHTML = bookBlock(state.book, state.bot, 'Options');
  } else {
    books.innerHTML = bookBlock(state.book, state.bot, 'Stocks');
  }
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto + '://' + location.host);
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'muhurat') render(msg.state);
    } catch (_) {}
  };
  ws.onclose = () => setTimeout(connect, 1200);
  ws.onerror = () => {};
}

fetch('/api/muhurat').then((r) => r.json()).then(render).catch(() => {});
connect();
</script>
</body>
</html>
